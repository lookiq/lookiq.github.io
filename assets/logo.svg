<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <!-- Soft Rose-Gold & Champagne Silk Metallic Gradient -->
    <linearGradient id="femmeGoldLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ee"/>
      <stop offset="25%" stop-color="#e8baa0"/>
      <stop offset="55%" stop-color="#d49b6a"/>
      <stop offset="80%" stop-color="#e5be85"/>
      <stop offset="100%" stop-color="#ad6e47"/>
    </linearGradient>

    <!-- Warm Cashmere Noir Glow -->
    <radialGradient id="femmeNoirLogo" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#241e22"/>
      <stop offset="60%" stop-color="#141113"/>
      <stop offset="100%" stop-color="#080708"/>
    </radialGradient>

    <filter id="femmeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#d49b6a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Jewel Pendant Icon (48x48) -->
  <g transform="translate(10, 12)" filter="url(#femmeShadow)">
    <rect x="0" y="0" width="48" height="48" rx="18" fill="url(#femmeNoirLogo)" stroke="url(#femmeGoldLogo)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="21" fill="none" stroke="url(#femmeGoldLogo)" stroke-width="0.6" stroke-dasharray="1.5 2" stroke-opacity="0.6"/>
    
    <path d="M16 13 C16 13, 16 29, 16 31 C16 34, 18 35, 20 35 H26" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="13" r="1.4" fill="url(#femmeGoldLogo)"/>

    <ellipse cx="28" cy="23" rx="8" ry="9.5" fill="none" stroke="url(#femmeGoldLogo)" stroke-width="2.6"/>
    <path d="M32 29 Q35 33, 37 37" fill="none" stroke="url(#femmeGoldLogo)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M28 17 L29 20 L32 21 L29 22 L28 25 L27 22 L24 21 L27 20 Z" fill="url(#femmeGoldLogo)"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(74, 15)">
    <!-- Wordmark -->
    <text x="0" y="27" 
          font-family="'Playfair Display', Didot, 'Bodoni MT', Georgia, serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="4.5" 
          fill="#141113">
      LOOKIQ
    </text>

    <!-- Subtle Rose-Gold Accent Line -->
    <line x1="0" y1="36" x2="175" y2="36" stroke="url(#femmeGoldLogo)" stroke-width="1.2" stroke-opacity="0.75"/>

    <!-- Feminine Curated Tagline -->
    <text x="1" y="46" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="7.8" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="#c98a5e">
      CURATED ELEGANCE • THE CHIC EDIT
    </text>
  </g>
</svg>
