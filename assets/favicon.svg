<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Rose-Gold & Champagne Silk Metallic Gradient -->
    <linearGradient id="femmeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ee"/>
      <stop offset="25%" stop-color="#e8baa0"/>
      <stop offset="55%" stop-color="#d49b6a"/>
      <stop offset="80%" stop-color="#e5be85"/>
      <stop offset="100%" stop-color="#ad6e47"/>
    </linearGradient>

    <!-- Warm Cashmere Noir Glow -->
    <radialGradient id="femmeNoir" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#241e22"/>
      <stop offset="60%" stop-color="#141113"/>
      <stop offset="100%" stop-color="#080708"/>
    </radialGradient>

    <!-- Specular Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#d49b6a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Oval Jewelry Charm Frame (Soft & Feminine) -->
  <rect x="3" y="3" width="58" height="58" rx="22" fill="url(#femmeNoir)" stroke="url(#femmeGold)" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#femmeGold)" stroke-width="0.6" stroke-dasharray="1.5 2.5" stroke-opacity="0.6"/>

  <!-- Graceful Interlocking LQ Monogram with Silk Ribbon Flow -->
  <g filter="url(#softGlow)">
    <!-- Silk Flow L -->
    <path d="M22 17 C22 17, 22 37, 22 40 C22 43.5, 24.5 44.5, 27 44.5 H34" 
          fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="17" r="1.8" fill="url(#femmeGold)"/>

    <!-- Delicate Ring Q -->
    <ellipse cx="36.5" cy="30" rx="10.5" ry="12" 
             fill="none" stroke="url(#femmeGold)" stroke-width="3.4"/>

    <!-- Flourishing Q Tail with Petal Drop -->
    <path d="M42 37 Q46 41, 48 46" 
          fill="none" stroke="url(#femmeGold)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Center Spark of Elegance (Diamond Starlight) -->
    <path d="M36.5 22.5 L37.7 26.5 L41.5 27.5 L37.7 28.5 L36.5 32.5 L35.3 28.5 L31.5 27.5 L35.3 26.5 Z" 
          fill="url(#femmeGold)"/>
  </g>
</svg>
