<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOKIQ | Redirecting to Product...</title>
  <link rel="canonical" href="https://lookiq.github.io/">
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('product');
      if (id) {
        window.location.replace('products/' + encodeURIComponent(id) + '.html');
      } else {
        window.location.replace('index.html#catalog');
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 60px 20px; background: #faf8f5; color: #121216;">
  <p>Redirecting to product details...</p>
  <p><a href="index.html#catalog" style="color: #c99738;">Click here if you are not redirected automatically.</a></p>
</body>
</html>
